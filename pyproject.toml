[project]
name = "harness-mvp"
version = "0.1.0"
description = "Multimodal misinformation detection Harness MVP"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["harness*"]
